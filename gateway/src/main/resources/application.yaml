server:
  port: 9001

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
          - id: AUTH
            uri: lb://AUTH
            predicates:
              - Path=/api/auth/**
          - id: PRODUK
            uri: lb://PRODUK
            predicates:
              - Path=/api/produk/**
          - id: ORDER-QUERY
            uri: lb://ORDER-QUERY
            predicates:
              - Path=/api/order-query/**
          - id: ORDER-SERVICE
            uri: lb://ORDER
            predicates:
              - Path=/api/order/**
          - id: PELANGGAN
            uri: lb://PELANGGAN
            predicates:
              - Path=/api/pelanggan/**
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost

# JWT (secret HARUS sama di semua service untuk validasi token)
app:
  jwt:
    secret: rayhan-super-secret-key-for-jwt-signing-2025-min-32-bytes
