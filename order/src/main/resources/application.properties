server.port=8083
spring.application.name=order

spring.datasource.url=jdbc:h2:mem:order;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
app.rabbit.order-email-queue=order.email

# JWT (secret HARUS sama di semua service untuk validasi token)
app.jwt.secret=rayhan-super-secret-key-for-jwt-signing-2025-min-32-bytes
