server.port=8086
spring.application.name=email

# Muat file .env (format KEY=VALUE) sebagai sumber properti Spring.
# Wajib memakai akhiran [.properties] agar Spring tahu cara mem-parsing file
# tanpa ekstensi tersebut. Dicari relatif terhadap working directory.
# Catatan: nilai dari environment variable OS tetap punya prioritas lebih tinggi,
# sehingga konfigurasi produksi tidak akan tertimpa oleh .env lokal.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
app.rabbit.order-email-queue=order.email

# Kredensial wajib berasal dari .env (atau environment variable).
# Sengaja tanpa nilai default agar aplikasi gagal cepat dengan pesan jelas
# bila kredensial tidak tersedia, bukan gagal diam-diam saat mengirim email.
app.mail.from=${MAIL_USERNAME}
app.mail.fallback-to=${MAIL_FALLBACK_TO:plowyeam45@gmail.com}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# --- Observability: simpan log ke file agar kegagalan SMTP dapat diperiksa ---
logging.file.name=logs/email-service.log
logging.level.org.springframework.mail=DEBUG
logging.level.org.eclipse.angus=INFO
